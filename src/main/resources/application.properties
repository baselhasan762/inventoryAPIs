spring.application.name=demo
spring.profiles.default = dev

spring.datasource.password = ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view = false

# Pagination: callers can't ask for more than 100 rows per page
spring.data.web.pageable.max-page-size=100

# Initial admin (seeded on startup if missing)
app.admin.email=admin@inventory.com
app.admin.password=${ADMIN_PASSWORD}


# Base64 key of at least 32 bytes, supplied by the environment so it never enters git
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

server.port=8081
spring.application.name=demo

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/inventoryapi?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Initial admin (seeded on startup if missing)
app.admin.email=admin@inventory.com
app.admin.password=Admin@12345


server.port=8081
# Pagination: callers can't ask for more than 100 rows per page
spring.data.web.pageable.max-page-size=100


# Base64 key of at least 32 bytes, supplied by the environment so it never enters git
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000